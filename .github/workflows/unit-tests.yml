name: Unit Tests

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/unit-tests.yml'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run unit tests
        # Run the fast, hermetic unit/logic suite (registry, notebook-validator
        # helpers, skills utilities, financial-model math, memory tool). The
        # notebook structure/execution tests under tests/notebook_tests are
        # covered by notebook-tests.yml and are excluded here to keep this job
        # fast and API-key-free.
        run: |
          uv run pytest \
            --ignore=tests/notebook_tests \
            -p no:cacheprovider \
            --junitxml=unit-test-results.xml | tee unit-test-output.txt

      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## Unit Test Results (Python ${{ matrix.python-version }})"
            echo ""
            echo '```'
            tail -n 1 unit-test-output.txt 2>/dev/null || echo "No test output produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
