name: Notebook Quality Check

on:
  pull_request:
    paths:
      - '**/*.ipynb'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/notebook-quality.yml'
  push:
    branches: [main]
    paths:
      - '**/*.ipynb'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # Need full history for diff
      
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      
      - name: Set up Python 3.11
        run: uv python install 3.11
      
      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras
      
      - name: Lint notebooks with Ruff
        run: |
          uv run ruff check **/*.ipynb --show-fixes || true
          uv run ruff format **/*.ipynb --check || true
      
      - name: Validate notebook structure
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        # shell: bash runs `bash --noprofile --norc -eo pipefail {0}`. The default
        # `bash -e {0}` has no pipefail, so `validate_notebooks.py | tee` returned
        # tee's 0 and a failing validator was reported as "no issues".
        shell: bash
        run: |
          # scripts/validate_notebooks.py only checks the .ipynb paths passed as
          # arguments (with none it prints "No notebooks to validate" and exits 0),
          # so hand it the notebooks changed in this PR / push.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            # --diff-filter=d excludes deleted notebooks, which cannot be read.
            CHANGED_NOTEBOOKS=$(git diff --name-only --diff-filter=d "origin/$BASE_REF"...HEAD | grep '\.ipynb$' || echo "")
          else
            CHANGED_NOTEBOOKS=$(git diff --name-only --diff-filter=d HEAD~1 HEAD | grep '\.ipynb$' || echo "")
          fi

          if [ -z "$CHANGED_NOTEBOOKS" ]; then
            echo "No notebooks changed; nothing to validate"
            echo "has_issues=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Validating changed notebooks:"
          echo "$CHANGED_NOTEBOOKS"
          mapfile -t NOTEBOOKS <<< "$CHANGED_NOTEBOOKS"

          # The pipeline sits in an `if` condition so that under -e a failing
          # validator does not abort the step before has_issues is written. The
          # validator's exit status is the primary signal; the cross-mark grep only
          # tells a reported issue apart from a crash (traceback, uv failure).
          if uv run python scripts/validate_notebooks.py "${NOTEBOOKS[@]}" 2>&1 | tee validation_output.txt; then
            echo "has_issues=false" >> "$GITHUB_OUTPUT"
          else
            if ! grep -q "❌" validation_output.txt; then
              echo "::error::validate_notebooks.py exited non-zero without reporting issues; see validation_output.txt"
            fi
            echo "has_issues=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
        continue-on-error: true

      - name: Summarize validation issues with Claude
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.validate.outputs.has_issues == 'true'
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            The notebook validation found these issues:

            ```
            $(cat validation_output.txt)
            ```

            Create a helpful PR comment that:
            - Summarizes the validation issues found
            - Groups similar issues together (e.g., "7 notebooks have empty cells")
            - Explains why empty cells are problematic and how to fix them (delete them or add content)
            - If there are error outputs, explain they should be cleared before committing
            - Uses friendly, constructive language
            - Includes specific notebook names and cell numbers for reference

            Format as a nice GitHub comment with markdown. Use emoji sparingly for clarity.
            Post using: gh pr comment $PR_NUMBER --body "your comment"
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Read"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # Only run API tests on main branch or for same-repo branches (costs money)
      - name: Execute notebooks (API Testing)
        if: |
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p test_outputs
          for notebook in $(find . -name "*.ipynb" -not -path "*/.*" -not -path "*/test_outputs/*"); do
            echo "📓 Testing: $notebook"
            output_name=$(echo "$notebook" | sed 's|/|_|g' | sed 's|\.|_|g')
            # Use nbconvert to execute notebooks and save outputs
            uv run jupyter nbconvert --to notebook \
              --execute "$notebook" \
              --ExecutePreprocessor.kernel_name=python3 \
              --ExecutePreprocessor.timeout=120 \
              --output "test_outputs/${output_name}_executed.ipynb" \
              --output-dir=. \
              || echo "⚠️  Failed: $notebook"
          done
      
      # Mock testing for fork PRs
      - name: Execute notebooks (Mock Testing)
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "🔒 Running in mock mode for external contributor"

          # `python -m nbformat.validator FILE` only imports the module and ignores
          # FILE (nbformat.validator has no __main__ block), so it always exited 0 and
          # validated nothing. Call nbformat.validate() directly, and aggregate
          # inside `if !` so -e does not stop at the first invalid notebook and
          # every failure is reported.
          failed=0
          for notebook in $(find . -name "*.ipynb" -not -path "*/.*"); do
            echo "📓 Validating structure: $notebook"
            if ! uv run python -c 'import sys, nbformat; nbformat.validate(nbformat.read(sys.argv[1], as_version=4))' "$notebook"; then
              echo "::error file=${notebook#./}::notebook fails nbformat schema validation"
              failed=$((failed+1))
            fi
          done
          [ "$failed" -eq 0 ] || { echo "::error::$failed invalid notebook(s)"; exit 1; }
      
      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: notebook-test-outputs
          path: test_outputs/
          retention-days: 7
