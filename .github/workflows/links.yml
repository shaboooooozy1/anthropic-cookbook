name: Link Check

on:
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: "0 0 * * SUN"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF"...HEAD | grep -E '\.(md|ipynb)$' || true)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Save changed files to output
          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.has_changes == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Convert notebooks for link extraction (PR - changed files only)
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.has_changes == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          pip install "jupyter==1.1.1" "nbconvert==7.17.1"
          mkdir -p temp_md

          # Convert only changed notebooks
          echo "$CHANGED_FILES" | grep '\.ipynb$' | while read nb; do
            if [ -f "$nb" ]; then
              echo "Converting: $nb"
              jupyter nbconvert --to markdown "$nb" \
                --output-dir=temp_md \
                --ExtractOutputPreprocessor.enabled=False
            fi
          done

      - name: Convert notebooks for link extraction (scheduled/manual - all files)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          pip install "jupyter==1.1.1" "nbconvert==7.17.1"
          mkdir -p temp_md

          for nb in $(find . -name "*.ipynb" -not -path "*/.*"); do
            echo "Converting: $nb"
            jupyter nbconvert --to markdown "$nb" \
              --output-dir=temp_md \
              --ExtractOutputPreprocessor.enabled=False
          done

      - name: Prepare file list for link checking (PR)
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.has_changes == 'true'
        id: file-list
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          FILES=""

          # Paths are spliced into lychee-action's args (an eval sink), so only
          # accept a conservative character set. This has to vet BOTH sources
          # below: a converted notebook's name comes from a PR-controlled
          # *.ipynb stem, so it is no more trustworthy than a changed path.
          # The set also excludes newlines, which keeps a filename from forging
          # extra key=value lines in $GITHUB_OUTPUT.
          is_safe_path() {
            case "$1" in
              "") return 1 ;;
              # A leading '-' makes lychee read the path as an option (e.g.
              # '-p./x.md' as --preprocess), and every character in it passes
              # the class below. The `--` in args: is the real fix; this keeps
              # such a path out of the list in the first place.
              -*) return 1 ;;
              *[!A-Za-z0-9._/-]*) return 1 ;;
            esac
            return 0
          }

          # Add all changed markdown files (from any directory)
          while IFS= read -r f; do
            if ! is_safe_path "$f"; then
              echo "Skipping path with unsafe characters: $f"
              continue
            fi
            if [ -f "$f" ]; then
              FILES="$FILES $f"
            fi
          done < <(echo "$CHANGED_FILES" | grep '\.md$')

          # Add converted notebooks. Expand the glob HERE and vet each result:
          # appending the literal string "temp_md/*.md" instead left the
          # filenames to be resolved by a later unquoted expansion, which put
          # unvetted notebook stems straight into file_args.
          for f in temp_md/*.md; do
            [ -f "$f" ] || continue
            if ! is_safe_path "$f"; then
              echo "Skipping converted notebook with unsafe characters: $f"
              continue
            fi
            FILES="$FILES $f"
          done

          # Strip the single leading space the accumulator adds. Deliberately
          # not `echo $FILES | xargs`: an unquoted expansion is what reopened
          # the injection above, and every element here is already vetted.
          FILES="${FILES# }"

          echo "Prepared files for lychee: $FILES"

          if [ -z "$FILES" ]; then
            echo "file_args=" >> $GITHUB_OUTPUT
            echo "has_files=false" >> $GITHUB_OUTPUT
          else
            echo "file_args=$FILES" >> $GITHUB_OUTPUT
            echo "has_files=true" >> $GITHUB_OUTPUT
          fi

      - name: Check Links with Lychee (PR - changed files only)
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.has_changes == 'true' && steps.file-list.outputs.has_files == 'true'
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: |
            --config lychee.toml
            --format markdown
            --no-progress
            --
            ${{ steps.file-list.outputs.file_args }}
          output: lychee-report.md
          fail: false
          failIfEmpty: false

      - name: Check Links with Lychee (scheduled/manual - all files)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: lychee-full
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: |
            --config lychee.toml
            --format markdown
            --no-progress
            --
            skills/**/*.md
            temp_md/*.md
            README.md
          output: lychee-report.md
          fail: false
          failIfEmpty: false
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && steps.lychee.outputs.exit_code != 0
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: link-check
          path: lychee-report.md
      
      - name: Upload link check results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: link-check-results
          path: |
            lychee-report.md
            .lycheecache