name: Verify Authors

on:
  pull_request:
    paths:
      - 'authors.yaml'
      - 'registry.yaml'
  push:
    branches:
      - main
    paths:
      - 'authors.yaml'
      - 'registry.yaml'

permissions:
  contents: read

jobs:
  verify-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install "pyyaml==6.0.3" "requests==2.34.2" "jsonschema==4.26.0"

      - name: Verify authors and registry
        run: |
          python .github/scripts/verify_registry.py
